name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: moriah-portfolio
        run: npm install

      - name: Build
        working-directory: moriah-portfolio
        run: |
          node --version
          npm --version
          ls node_modules/.bin/ | grep vite || echo "WARNING: vite not in node_modules/.bin"
          node node_modules/vite/bin/vite.js build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: moriah-portfolio/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
